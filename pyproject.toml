[project]
name = "contract-validation"
version = "0.1.0"
description = "Financial consistency checks for procurement contract documents"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Azaliya Khakimullina" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_validation"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    # Cyrillic text in test fixtures is intentional, not a homoglyph mistake.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
